name: Deploy website
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: flox/install-flox-action@v2
      - run: flox activate -- ./setup-dev.sh
      - run: flox activate -- bunx playwright install-deps chromium
      - name: Build website and documentation
        env:
          NEXT_PUBLIC_BASE_PATH: /pyreload-cli
          SITE_URL: https://smeltery.github.io/pyreload-cli
        run: flox activate -- bun run --cwd website build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
