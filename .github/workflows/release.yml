name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate tag format
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Require successful CI for the release revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/master
          count="$(gh run list --workflow ci.yml --commit "$(git rev-parse HEAD)" --event push --status success --json databaseId --jq length)"
          test "$count" -gt 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set build version from tag
        run: python scripts/release_version.py "$RELEASE_TAG"
      - run: python -m pip install build==1.2.2.post1 twine==6.1.0
      - run: python -m build && twine check dist/*
      - name: Smoke test wheel version
        run: |
          pip install dist/*.whl
          test "$(pyreload --version)" = "pyreload ${RELEASE_TAG#v}"
      - name: Publish GitHub artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum ./*.whl ./*.tar.gz > SHA256SUMS)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
      - name: Publish to PyPI when configured
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$TWINE_PASSWORD" ]; then
            twine upload --skip-existing dist/*.whl dist/*.tar.gz
          else
            echo '::notice::PYPI_API_TOKEN is not configured; GitHub artifacts are available.'
          fi
